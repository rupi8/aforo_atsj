<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Consulta de Zonas Copa del Rey</title>
</head>
<body>
<h2>📊 Resultado de zonas</h2>
<pre id="resultado">Cargando...</pre>

<script>
const url = "https://apiteatros.compralaentrada.com/api1/f/zonas?sesion_id=18532///";

fetch(url, {
  headers: {
    "Accept": "application/json",
    "Hash-Teatro": "2IcJsvmDMf3LM9rJREmH"
  }
})
  .then(response => response.json())
  .then(data => {
    const zonas = data.data || data.body || [];
    let texto = "";
    let totalOcupadas = 0; // <-- Variable para acumular ocupadas

    zonas.forEach(z => {
      if (z.name !== "ABONADOS" && z.name !== "PALCO") {
        const aforo = parseInt(z.aforo || 0);
        const libres = parseInt(z.libres || 0);
        const ocupadas = aforo - libres;
        totalOcupadas += ocupadas; // <-- Sumar al total
        texto += `🟢 ${z.name}: ${ocupadas} ocupadas / ${aforo} total\n`;
      }
    });

    texto += `\n📌 Total ocupadas: ${totalOcupadas}`; // <-- Mostrar total
    document.getElementById("resultado").textContent = texto;
  })
  .catch(err => {
    document.getElementById("resultado").textContent = "❌ Error: " + err;
  });
</script>
</body>
</html>
